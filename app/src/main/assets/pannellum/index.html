<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Viewer</title>
    <link rel="stylesheet" href="pannellum.css"/>
    <script type="text/javascript" src="pannellum.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #0f172a; overflow: hidden; }
        #panorama { width: 100%; height: 100%; }

        /* Custom animated pulsing hotspot icon per FR-TOUR-02 */
        .custom-hotspot {
            height: 38px; width: 38px;
            background: #1a56db;
            border: 2px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 0 0 rgba(26, 86, 219, 0.7);
            animation: pulse-blue 2s infinite;
            display: flex; align-items: center; justify-content: center;
            color: #ffffff; font-size: 18px; font-weight: bold;
        }

        @keyframes pulse-blue {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(26, 86, 219, 0.7);
            }
            70% {
                transform: scale(1.1);
                box-shadow: 0 0 0 14px rgba(26, 86, 219, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(26, 86, 219, 0);
            }
        }
    </style>
</head>
<body>

<div id="panorama"></div>

<script>
    var viewer = null;
    var pressTimer = null;
    var startX = 0, startY = 0;

    function loadPanorama(imageUrl) {
        if (viewer) { viewer.destroy(); }
        viewer = pannellum.viewer('panorama', {
            "type": "equirectangular",
            "panorama": imageUrl,
            "autoLoad": true,
            "showControls": true,
            "compass": true,
            "friction": 0.15
        });

        var container = document.getElementById('panorama');

        // Long press detection threshold 400ms per FR-TOUR-02
        container.addEventListener('mousedown', startPress);
        container.addEventListener('touchstart', startPress);

        container.addEventListener('mouseup', cancelPress);
        container.addEventListener('touchend', cancelPress);
        container.addEventListener('mousemove', checkMove);
        container.addEventListener('touchmove', checkMove);

        function startPress(e) {
            var clientX = e.touches ? e.touches[0].clientX : e.clientX;
            var clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX; startY = clientY;

            pressTimer = setTimeout(function() {
                if (viewer) {
                    var coords = viewer.canvasToFinalPitchYaw(e);
                    if (coords && window.AndroidBridge && window.AndroidBridge.onPanoramaLongPress) {
                        window.AndroidBridge.onPanoramaLongPress(coords[0], coords[1]);
                    }
                }
            }, 400);
        }

        function cancelPress() {
            if (pressTimer) clearTimeout(pressTimer);
        }

        function checkMove(e) {
            var clientX = e.touches ? e.touches[0].clientX : e.clientX;
            var clientY = e.touches ? e.touches[0].clientY : e.clientY;
            if (Math.abs(clientX - startX) > 10 || Math.abs(clientY - startY) > 10) {
                cancelPress();
            }
        }
    }

    function addHotspot(id, pitch, yaw, title, targetSceneId) {
        if (!viewer) return;
        viewer.addHotspot({
            "id": id,
            "pitch": pitch,
            "yaw": yaw,
            "type": "info",
            "text": title,
            "cssClass": "custom-hotspot",
            "createTooltipArgs": targetSceneId,
            "clickHandlerFunc": function(evt, args) {
                if (window.AndroidBridge && window.AndroidBridge.onHotspotClicked) {
                    window.AndroidBridge.onHotspotClicked(id, targetSceneId);
                }
            }
        });
    }
</script>
</body>
</html>
