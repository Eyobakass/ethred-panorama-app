name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Show Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/ndk || echo "No NDK"
          ls $ANDROID_HOME/cmake || echo "No CMake"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Print compilation errors
        if: failure()
        run: |
          echo "=== KOTLIN / JAVA ERRORS ==="
          grep -E "^e:|error:|\.kt:[0-9]+|\.java:[0-9]+|Unresolved reference|None of the following|overload resolution" build.log | head -100 || echo "No error lines found"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ethred-360-photo-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
